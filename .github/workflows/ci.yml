name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows dual-target validation
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository and pinned vendors
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show vendor pins
        shell: pwsh
        run: git submodule status

      - name: Restore
        shell: pwsh
        run: dotnet restore MyDmsVn.BootstrapSourceGrid.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build MyDmsVn.BootstrapSourceGrid.sln -c Release --no-restore

      - name: Test both target frameworks
        shell: pwsh
        run: dotnet test tests/MyDmsVn.BootstrapSourceGrid.Tests/MyDmsVn.BootstrapSourceGrid.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 5m

      - name: Verify vendor worktrees stayed clean
        shell: pwsh
        run: |
          if (git -C vendor/Bootstrap5WinFormUI status --porcelain) {
            throw "Bootstrap vendor became dirty"
          }
          if (git -C vendor/sourcegrid status --porcelain) {
            throw "SourceGrid vendor became dirty"
          }

      - name: Pack inspection artifact only
        shell: pwsh
        run: dotnet pack src/MyDmsVn.BootstrapSourceGrid/MyDmsVn.BootstrapSourceGrid.csproj -c Release --no-build -o artifacts/packages

      - name: Inspect package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem artifacts/packages/MyDmsVn.BootstrapSourceGrid.*.nupkg |
            Where-Object { $_.Name -notlike '*.snupkg' })
          if ($packages.Count -ne 1) {
            throw "Expected one nupkg, found $($packages.Count)."
          }
          $packagePath = $packages[0].FullName
          $packageZip = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entryNames = @($packageZip.Entries | ForEach-Object FullName)
            @(
              'README.md',
              'lib/net48/MyDmsVn.BootstrapSourceGrid.dll',
              'lib/net8.0-windows7.0/MyDmsVn.BootstrapSourceGrid.dll'
            ) | ForEach-Object {
              if ($_ -notin $entryNames) {
                throw "Missing package entry: $_"
              }
            }
            if ($entryNames -match '(^|/)(SourceGrid|MyDmsVn\.Bootstrap5WinFormUI)\.dll$') {
              throw 'A vendor binary was embedded in the integration package.'
            }
            $nuspecEntry = $packageZip.GetEntry('MyDmsVn.BootstrapSourceGrid.nuspec')
            $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
            try {
              $nuspecText = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
            if ($nuspecText -notmatch '<license type="expression">MIT</license>') {
              throw 'MIT package license expression is missing.'
            }
            if ($nuspecText -notmatch '<readme>README.md</readme>') {
              throw 'Package README metadata is missing.'
            }
          }
          finally {
            $packageZip.Dispose()
          }

      - name: Upload non-publishable inspection packages
        uses: actions/upload-artifact@v4
        with:
          name: inspection-packages-not-for-publication
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
